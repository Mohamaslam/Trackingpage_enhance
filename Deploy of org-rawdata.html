<style>
  .PageHeader {
    display: none;
  }

  .w-100 {
    width: 100% !important;
  }

  .cap {
    text-transform: capitalize;
    color: rgb(var(--color-foreground) / 1);
  }

  .nr {
    color: rgb(var(--color-foreground) / 1);
  }

  #renderResponse p {
    color: rgb(var(--color-foreground) / .6);
  }

  #renderResponse .Segment__Title {
    margin-bottom: 14px;
  }

  #renderResponse .Segment {
    margin-top: 25px;
    border-bottom: 1px solid rgb(var(--color-border));
    padding-bottom: 25px;
  }

  #renderResponse .Segment:last-child {
    border-bottom: none;
  }

  #renderResponse .Segment+.Segment {
    margin-top: 25px;
  }

  #renderResponse .mb-0 {
    margin-top: 0;
    margin-bottom: 0;
  }

  #renderResponse .mb-4 {
    margin-bottom: 20px;
  }

  .ta-center {
    text-align: center;
  }

  #renderResponse .mt-4 {
    margin-top: 20px;
  }

  #renderResponse .button--close {
    height: var(--sp-12);
    width: var(--sp-12);
    flex: 0 0 auto;
    margin-inline-start: auto;
  }

  p.orderConfirmation {
    color: var(--text-color) !important;
    line-height: 1.65;
    margin-bottom: 20px;
    border: 1px solid rgb(var(--color-foreground));
    padding: 6px;
  }

  /* Status badge styles */
  .status-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    color: #fff;
    vertical-align: middle;
  }

  .status--processing { background: #f59e0b; } /* amber */
  .status--pending    { background: #6b7280; } /* gray */
  .status--shipped    { background: #3b82f6; } /* blue */
  .status--delivered  { background: #10b981; } /* green */
  .status--cancelled  { background: #ef4444; } /* red */
  .status--in_transit  { background: #6366f1; } /* indigo */
  .status--default    { background: #374151; }

  /* Progress stepper styles */
  .order-progress {
    /* replace per-step layout with a single horizontal track */
    display: block;
    position: relative;
    padding: 18px 6px;
    background: transparent;
    overflow: visible; /* ensure emoji isn't clipped */
  }

  .order-track {
    position: relative;
    height: 14px;
    background: rgba(229,231,235,0.35);
    border-radius: 8px;
    overflow: visible;
    z-index: 0;
  }

  .order-track-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: linear-gradient(90deg,#3b82f6 0%, #06b6d4 50%, #10b981 100%);
    border-radius: 8px;
    transition: width 2200ms cubic-bezier(.2,.8,.2,1);
    z-index: 1;
  }
  .order-track-fill .flow{position:absolute;left:-40%;top:0;bottom:0;width:60%;background:linear-gradient(90deg,rgba(255,255,255,0.18),rgba(255,255,255,0.02),rgba(255,255,255,0.18));opacity:0.55;animation:flow 1.2s linear infinite}
  @keyframes flow{from{transform:translateX(0)}to{transform:translateX(160%)}}

  .order-markers {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
  }

  .order-marker {
    font-size: 12px;
    color: #374151;
    text-align: center;
    flex: 1 1 0;
    padding: 0 6px;
    white-space: nowrap;
  }

  /* visible dot above the track for each marker */
  .order-marker {
    position: relative;
    padding-top: 18px; /* space for the dot */
  }

  .order-marker::before {
    content: '';
    position: absolute;
    top: 2px; /* place dot above track */
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #e5e7eb; /* gray */
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    transition: background 900ms ease, transform 900ms ease, box-shadow 900ms ease;
    z-index: 5;
  }

  .order-marker.active::before {
    background: linear-gradient(90deg,#3b82f6,#10b981);
    transform: translateX(-50%) scale(1.18);
    box-shadow: 0 4px 8px rgba(16,185,129,0.14);
  }

  .order-marker .marker-label{ display:block; margin-top:6px; font-size:12px; color:#374151 }

  /* moving emoji that shows progress */
  .track-emoji {
    position: absolute;
    top: -10px; /* sit slightly above the track */
    left: 0%;
    transform: translateX(-50%) scale(1);
    /* use same duration for left and transform to keep movements in sync */
    transition: left 2200ms cubic-bezier(.2,.8,.2,1), transform 2200ms cubic-bezier(.2,.8,.2,1);
    font-size: 22px;
    pointer-events: none;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.12));
    z-index: 9999;
  }

  /* truck always faces right */
  .track-emoji.truck { 
    transform-origin: center center;
    /* always face right: align the truck's right edge to the track position
       and force a neutral rotation so platform emoji variants appear consistent */
    transform: translateX(-100%) scale(1) scaleX(1) rotate(0deg);
    transition: left 2200ms cubic-bezier(.2,.8,.2,1), transform 2200ms cubic-bezier(.2,.8,.2,1);
  }
  /* when at delivered state, just scale up slightly */
  .track-emoji.truck.rotate { 
    transform: translateX(-100%) scale(1.15) scaleX(1) rotate(0deg); 
  }

  .step-label {
    font-size: 12px;
    color: #374151;
  }

  .step-completed .step-indicator {
    background: #10b981; /* green */
  }

  .step-current .step-indicator {
    background: #3b82f6; /* blue */
  }

  .step-completed .step-line,
  .step-current .step-line {
    background: transparent;
  }

  /* indicator animation */
  .step-indicator {
    transition: transform 900ms ease, background 900ms ease, box-shadow 900ms ease;
  }

  .step-completed .step-indicator {
    transform: scale(1.05);
  }

  .step-current .step-indicator {
    transform: scale(1.25);
    box-shadow: 0 0 0 6px rgba(59,130,246,0.08);
  }

  /* Compact layout for narrow containers */
  @media (max-width: 420px) {
    .step-label { display: none; }
  }
</style>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<script>
  $(document).ready(function () {

    // ---------- Functions ----------
    function statusBadge(status) {
      if (!status) return '<span class="status-badge status--default" aria-label="status unknown">Unknown</span>';
      var key = String(status).toLowerCase().replace(/\s+/g, '_');
      var map = {
        'processing': { cls: 'status--processing', label: 'Processing' },
        'pending': { cls: 'status--pending', label: 'Pending' },
        'shipped': { cls: 'status--shipped', label: 'Shipped' },
        'delivered': { cls: 'status--delivered', label: 'Delivered' },
        'cancelled': { cls: 'status--cancelled', label: 'Cancelled' },
        'in_transit': { cls: 'status--in_transit', label: 'In transit' }
      };
      var entry = map[key] || { cls: 'status--default', label: status };
      return '<span class="status-badge ' + entry.cls + '" role="status" aria-live="polite">' + entry.label + '</span>';
    }

    // Progress stepper renderer
    // Use a 4-step sequence that matches the server's shipment_status values:
    // 0: Ordered, 1: Shipped, 2: In transit, 3: Delivered
    var defaultSteps = ['Ordered', 'Shipped', 'In transit', 'Delivered'];

    // Map known tokens to the 4-step index. We use ordered checks so more specific tokens
    // are matched first. 'Out for delivery' will be treated as 'In transit' (index 2)
    // because the server uses only four statuses.
    function mapShipmentStatusToStep(status) {
      if (!status) return 0; // Ordered
      var s = String(status).toLowerCase();
      // exact/common tokens -> index
      var mappings = [
        { tokens: ['ordered','placed','processing','pending'], idx: 0 },
        { tokens: ['shipped','dispatched'], idx: 1 },
        { tokens: ['in transit','in_transit','transit','out for delivery','out_for_delivery','on the way','on its way'], idx: 2 },
        { tokens: ['delivered','complete','fulfilled','completed','delivered_successfully'], idx: 3 }
      ];
      for (var i = 0; i < mappings.length; i++) {
        var entry = mappings[i];
        for (var j = 0; j < entry.tokens.length; j++) {
          if (s.indexOf(entry.tokens[j]) !== -1) return entry.idx;
        }
      }
      // fallback: if contains 'transit' map to in transit
      if (s.indexOf('transit') !== -1) return 2;
      return 0;
    }

    // Helper: recursively scan object/string fields for known tokens and return the first matching value
    function scanForKnownTokensInObject(obj, tokens) {
      if (!obj || !tokens) return null;
      if (typeof obj === 'string') {
        var lower = obj.toLowerCase();
        for (var t = 0; t < tokens.length; t++) if (lower.indexOf(tokens[t]) !== -1) return obj;
        return null;
      }
      if (Array.isArray(obj)) {
        for (var a = 0; a < obj.length; a++) {
          var res = scanForKnownTokensInObject(obj[a], tokens);
          if (res) return res;
        }
        return null;
      }
      if (typeof obj === 'object') {
        for (var k in obj) {
          if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
          var v = obj[k];
          if (typeof v === 'string') {
            var lower = v.toLowerCase();
            for (var ti = 0; ti < tokens.length; ti++) if (lower.indexOf(tokens[ti]) !== -1) return v;
          } else if (typeof v === 'object') {
            var nested = scanForKnownTokensInObject(v, tokens);
            if (nested) return nested;
          }
        }
      }
      return null;
    }

    // Derive shipment status from fulfillment fields when present, but if shipment_status
    // is missing, scan the fulfillment object for any string field containing a known token.
    // As a last resort, check order-level fulfillment_status but only if it contains known tokens.
    function deriveProgressStatus(orderData) {
      if (!orderData) return null;
      var knownTokens = ['pending','processing','shipped','dispatched','in transit','in_transit','transit','out for delivery','out_for_delivery','on the way','delivered','complete','fulfilled'];
      if (orderData.fulfillments && orderData.fulfillments.length > 0) {
        var f = orderData.fulfillments[0];
        if (f) {
          if (f.shipment_status) return String(f.shipment_status);
          if (f.status) return String(f.status);
          if (f.tracking_status) return String(f.tracking_status);
          if (f.fulfillment_status) return String(f.fulfillment_status);
          // infer from tracking numbers / urls when explicit shipment_status is missing
          if (f.tracking_numbers && f.tracking_numbers.length > 0) return 'in transit';
          if (f.tracking_urls && f.tracking_urls.length > 0) return 'in transit';
          // scan other fields of fulfillment for any known token
          var scanned = scanForKnownTokensInObject(f, knownTokens);
          if (scanned) return String(scanned);
        }
      }
      // order-level fallback
      if (orderData.orders) {
        if (orderData.orders.fulfillment_status) {
          var cand = String(orderData.orders.fulfillment_status);
          var found = scanForKnownTokensInObject(cand, knownTokens);
          if (found) return cand;
        }
        // also scan other order-level fields
        var scannedOrder = scanForKnownTokensInObject(orderData.orders, knownTokens);
        if (scannedOrder) return String(scannedOrder);
      }
      return null;
    }

    // Detect if we inferred the status from tracking numbers/urls so diagnostics can show the source
    function inferenceSource(orderData) {
      if (!orderData) return null;
      if (orderData.fulfillments && orderData.fulfillments.length > 0) {
        var f = orderData.fulfillments[0];
        if (f) {
          if (!f.shipment_status) {
            if (f.tracking_numbers && f.tracking_numbers.length > 0) return 'tracking_numbers';
            if (f.tracking_urls && f.tracking_urls.length > 0) return 'tracking_urls';
          }
        }
      }
      return null;
    }

    function renderOrderProgress(steps, activeIndex) {
      steps = steps || defaultSteps;
      activeIndex = Math.max(0, Math.min(steps.length - 1, activeIndex || 0));

      var container = $('#orderProgress');
      container.empty();
      // single continuous track
      var track = $('<div class="order-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>');
  var fillEl = $('<div class="order-track-fill"><span class="flow"></span></div>');
      // pick emoji for overall track based on active label
      var chosenEmoji = '📦';
      var activeLabel = (steps[activeIndex] || '').toLowerCase();
      if (activeLabel.indexOf('in transit') !== -1 || activeLabel.indexOf('shipped') !== -1 || activeLabel.indexOf('out for delivery') !== -1) chosenEmoji = '🚚';
    var emojiEl = $('<div class="track-emoji" aria-hidden="true">' + chosenEmoji + '</div>');
  if (chosenEmoji === '🚚') emojiEl.addClass('truck').css('transform', 'translateX(-100%) scale(1) scaleX(1) rotate(0deg)');
      track.append(fillEl);
      track.append(emojiEl);

      var markers = $('<div class="order-markers" aria-hidden="true"></div>');
      for (var i = 0; i < steps.length; i++) {
        markers.append('<div class="order-marker">' + steps[i] + '</div>');
      }

      container.append(track);
      container.append(markers);
      $('#orderProgressContainer').show();

      // initialize and animate to activeIndex
      clearProgressAnimation();
      var percent = Math.round((activeIndex) / (Math.max(1, steps.length - 1)) * 100);
      // set in a timeout to ensure CSS transition runs
      setTimeout(function () {
        fillEl.css('width', percent + '%');
        emojiEl.css('left', percent + '%');
        // align truck emoji to the right side of its position (so it "sits" on the right edge)
        if (chosenEmoji === '🚚') {
          // use translateX(-100%) so the truck's right edge matches the percentage position
          // force a neutral rotation (0deg) so it faces right on all platforms
          emojiEl.css('transform', 'translateX(-100%) scale(' + (activeIndex > 0 ? 1.3 : 1) + ') scaleX(1) rotate(0deg)');
        } else {
          // non-truck emoji remain centered
          emojiEl.css('transform', 'translateX(-50%) scale(' + (activeIndex > 0 ? 1.3 : 1) + ')');
        }
        // mark markers active up to activeIndex
        $('#orderProgress .order-marker').each(function(i, el){
          if (i <= activeIndex) $(el).addClass('active'); else $(el).removeClass('active');
        });
      }, 10);
    }

    // helper to get label for a step index
    function stepLabelForIndex(idx) {
      return defaultSteps[Math.max(0, Math.min(defaultSteps.length - 1, idx))];
    }

    var _progressTimeouts = [];
  var _progressInterval = null;

    function clearProgressAnimation() {
      _progressTimeouts.forEach(function (t) { clearTimeout(t); });
      _progressTimeouts = [];
      // reset single-track elements
      $('#orderProgress .order-track-fill').css('width', '0%');
      $('#orderProgress .track-emoji').css('left', '0%').css('transform', 'translateX(-50%) scale(1)');
      // remove legacy classes if present
      $('#orderProgress .order-step').removeClass('step-completed step-current');
    }

    function animateOrderProgress(targetIndex) {
      // single-track animation: move fill and single emoji to the target percent
      var track = $('#orderProgress .order-track');
      var fill = track.find('.order-track-fill');
      var emoji = track.find('.track-emoji');
      var markers = $('#orderProgress .order-marker');
      var stepsCount = Math.max(1, markers.length - 1);
      var percent = Math.round((targetIndex) / stepsCount * 100);
      // set ARIA for assistive tech
      track.attr('aria-valuenow', percent);
      // animate fill
      fill.css('width', percent + '%');
      // move emoji and handle truck direction
      emoji.css('left', percent + '%');
      if (emoji.hasClass('truck')) {
        // at delivered state (last step), face right and scale up
        if (targetIndex >= (stepsCount - 1)) {
          emoji.addClass('rotate');
          // keep the truck right-facing by using translateX(-100%) so the right edge sits on the percent
          emoji.css('transform', 'translateX(-100%) scale(1.35) scaleX(1) rotate(0deg)');
        } else {
          // during movement, keep facing forward (right) and scale slightly
          emoji.removeClass('rotate');
          emoji.css('transform', 'translateX(-100%) scale(1.35) scaleX(1) rotate(0deg)');
        }
      } else {
        // non-truck emoji just scales and remain centered
        emoji.css('transform', 'translateX(-50%) scale(1.35)');
      }
      // update markers
      $('#orderProgress .order-marker').each(function(i, el){
        if (i <= targetIndex) $(el).addClass('active'); else $(el).removeClass('active');
      });
      // slightly normalize scale after transition (maintain rotation state)
      setTimeout(function () {
        if (emoji.hasClass('truck')) {
          // keep facing right, normalize scale (right-edge alignment preserved)
          emoji.css('transform', 'translateX(-100%) scale(1.15) scaleX(1) rotate(0deg)');
        } else {
          emoji.css('transform', 'translateX(-50%) scale(1.15)');
        }
      }, 3800); // match CSS transition time
    }

    // Build progress DOM without animating (used before server response)
    function buildProgressDom(steps) {
      // Build simplified single-track skeleton used for indeterminate animation
      steps = steps || defaultSteps;
      var container = $('#orderProgress');
      container.empty();
      var track = $('<div class="order-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>');
  var fill = $('<div class="order-track-fill"><span class="flow"></span></div>');
  var emoji = $('<div class="track-emoji" aria-hidden="true">📦</div>');
      track.append(fill);
      track.append(emoji);
      var markers = $('<div class="order-markers" aria-hidden="true"></div>');
      for (var i = 0; i < steps.length; i++) markers.append('<div class="order-marker">' + steps[i] + '</div>');
      container.append(track);
      container.append(markers);
      $('#orderProgressContainer').show();
    }

    function startIndeterminateProgress() {
      // Make sure DOM exists
      if ($('#orderProgress .order-track').length === 0) buildProgressDom();
      clearProgressAnimation();
      var track = $('#orderProgress .order-track');
      var fill = track.find('.order-track-fill');
      var emoji = track.find('.track-emoji');
      var markers = $('#orderProgress .order-marker');
      var idx = 0;
      // sweep the emoji across markers
      // interval longer than transition so each sweep completes before next step
      _progressInterval = setInterval(function () {
        var stepsCount = Math.max(1, markers.length - 1);
        var percent = Math.round((idx) / stepsCount * 100);
        // trigger in timeout so transition animates
        setTimeout(function () {
          fill.css('width', percent + '%');
          emoji.css('left', percent + '%');
          // handle truck direction during sweep (always face right)
          if (emoji.hasClass('truck')) {
            if (idx >= (markers.length - 1)) {
              emoji.addClass('rotate');
              emoji.css('transform', 'translateX(-100%) scale(1.25) scaleX(1) rotate(0deg)');
            } else {
              emoji.removeClass('rotate');
              emoji.css('transform', 'translateX(-100%) scale(1.25) scaleX(1) rotate(0deg)');
            }
          } else {
            emoji.css('transform', 'translateX(-50%) scale(1.25)');
          }
          // mark current marker active
          $('#orderProgress .order-marker').each(function(i, el){
            if (i <= idx) $(el).addClass('active'); else $(el).removeClass('active');
          });
        }, 20);
        setTimeout(function () {
          if (emoji.hasClass('truck')) {
            // normalize back to neutral scale while preserving right-edge alignment
            emoji.css('transform', 'translateX(-100%) scale(1) scaleX(1) rotate(0deg)');
          } else {
            emoji.css('transform', 'translateX(-50%) scale(1)');
          }
        }, 3800); // match CSS transition time
        idx = (idx + 1) % markers.length;
      }, 4200); // interval slightly larger than transition for smooth pacing
    }

    function stopIndeterminateProgress() {
      if (_progressInterval) { clearInterval(_progressInterval); _progressInterval = null; }
      clearProgressAnimation();
    }

    function displayOrderDetails(orderData) {
      $("#errorDiv").hide();
      $("#orderDetails").show();

      // Determine shipment status to drive progress bar using a robust derivation helper
      var progressStatus = deriveProgressStatus(orderData);
      console.debug('deriveProgressStatus ->', progressStatus);
      var activeStep = mapShipmentStatusToStep(progressStatus);
      console.debug('mapped activeStep ->', activeStep);
      renderOrderProgress(null, activeStep);

    // populate diagnostics on page for easier QA
    $('#derivedStatusDisplay').remove();
    $('#orderProgressContainer').after('<div id="derivedStatusDisplay" style="font-size:12px;color:#374151;margin-bottom:8px;"></div>');
    var dsText = 'Derived shipment_status: ' + (progressStatus || 'none') + ' — Progress step: ' + activeStep + ' (' + stepLabelForIndex(activeStep) + ')';
    var inferredFrom = inferenceSource(orderData);
    if (inferredFrom) dsText += ' — (inferred from ' + inferredFrom + ')';
        // also list raw fulfillment shipment_status values for debugging
        if (orderData.fulfillments && orderData.fulfillments.length > 0) {
          var vals = orderData.fulfillments.map(function (f) { return f.shipment_status || '(none)'; }).join(' | ');
          dsText += ' — All fulfillment.shipment_status: ' + vals;
        }
        $('#derivedStatusDisplay').text(dsText);

        // add a toggle to view raw JSON response for debugging
        $('#rawResponseDump').remove();
        $('#derivedStatusDisplay').after('\n        <div id="rawResponseDump" style="margin-bottom:8px;">\n          <button id="toggleRawResponse" style="font-size:12px;margin-top:6px;">Show raw response</button>\n          <pre id="rawResponsePre" style="display:none;background:#f8fafc;border:1px solid #e5e7eb;padding:8px;white-space:pre-wrap;max-height:220px;overflow:auto;margin-top:6px;"></pre>\n        </div>');
        $('#rawResponsePre').text(JSON.stringify(orderData, null, 2));
        $('#toggleRawResponse').off('click').on('click', function () {
          var p = $('#rawResponsePre');
          if (p.is(':visible')) {
            p.hide(); $(this).text('Show raw response');
          } else {
            p.show(); $(this).text('Hide raw response');
          }
        });

      $("#orderNumberDisplay").html("<p class='mb-0'>Order Number: <span class='cap'>" + orderData.orders.order_number + "</span></p>");
      $("#fulfillmentStatus").html("<p class='mb-0'>Fulfillment Status: " + statusBadge(orderData.orders.fulfillment_status) + "</p>");
      $("#financialStatus").html("<p class='mb-0'>Financial Status: <span class='cap'>" + orderData.orders.financial_status + "</span></p>");
      $("#emailAddress").html("<p class='mb-0'>Email: <span class='nr'>" + orderData.orders.email + "</span></p>");
      $("#customerPhone").html("<p class='mb-0'>Phone: <span class='cap'>" + orderData.orders.phone + "</span></p>");

      $("#shippingAddress").html(orderData.orders.shipping_address);

      var lineItemsDiv = $("#lineItems");
      lineItemsDiv.empty();

      if (orderData.orders.line_items && orderData.orders.line_items.length > 0) {
        orderData.orders.line_items.forEach(function (item) {
          var itemDiv = $("<div class='mb-4'></div>");
          itemDiv.append("<p class='mb-0'>Name: <span class='cap'>" + item.name + "</span></p>");
          itemDiv.append("<p class='mb-0'>SKU: <span class='cap'>" + item.sku + "</span></p>");
          itemDiv.append("<p class='mb-0'>Price: <span class='cap'>₹" + item.price + "</span></p>");
          lineItemsDiv.append(itemDiv);
        });

        lineItemsDiv.append("<p class='mt-4 mb-0'>Total price: <span class='cap'>₹" + orderData.orders.total_price + "</span></p>");
        lineItemsDiv.append("<p class='mb-0'>Including ₹" + orderData.orders.total_tax + " in taxes</p>");
        lineItemsDiv.append("<p class='mb-0'>Shipping price: <span class='cap'>₹" + orderData.orders.shipping_price + "</span></p>");
      } else {
        lineItemsDiv.text("No order items found.");
      }

      var fulfillmentsDiv = $("#fulfillments");
      fulfillmentsDiv.empty();

      if (orderData.fulfillments && orderData.fulfillments.length > 0) {
        orderData.fulfillments.forEach(function (fulfillment) {
          var fulfillmentDiv = $("<div class='mb-4'></div>");
          fulfillmentDiv.append("<p class='mb-0'>Shipment Status: " + statusBadge(fulfillment.shipment_status) + "</p>");
          fulfillmentDiv.append("<p class='mb-0'>Tracking Company: <span class='cap'>" + fulfillment.tracking_company + "</span></p>");
          fulfillmentDiv.append("<p class='mb-0'>Tracking Number: <span class='cap'>" + fulfillment.tracking_numbers[0] + "</span></p>");
          if (fulfillment.tracking_urls[0]) {
            fulfillmentDiv.append('<p class="mb-0">Tracking URL: <span><a target="_blank" href="' + fulfillment.tracking_urls[0] + '">' + fulfillment.tracking_urls[0] + '</a></span></p>');
          }
          fulfillmentsDiv.append(fulfillmentDiv);
        });
      } else {
        fulfillmentsDiv.text("Order is under processing & you will get an update within 24-48 hours");
        $("#orderNumberDisplay").prepend('<p class="orderConfirmation">The order has been placed and the order details will be shared through email</p>');
      }
    }

    function displayError(errorMessage) {
      $("#orderDetails").hide();
      $("#errorDiv").show();
      $("#errorMessage").text(errorMessage);
    }

    // ---------- Event Handlers ----------
    $("#closeCurrent").click(function (e) {
      // stop any running animation
      stopIndeterminateProgress();
      clearProgressAnimation();
      $("#renderResponse").hide();
      $("#orderForm").show();
      $("#orderNumber, #email").val('');
      e.preventDefault();
    });

    $("#orderForm").submit(function (event) {
      event.preventDefault();

      $("#submitButton").prop("disabled", true).text("Fetching...");

      var orderNumber = $("#orderNumber").val();
      var email = $("#email").val();

      // show indeterminate progress immediately
      startIndeterminateProgress();

      $.ajax({
        url: "https://analytics.triproriginals.com/tracking",
        method: "GET",
        data: {
          order_id: orderNumber,
          email: email
        },
        dataType: "json",
        success: function (response) {
          // stop indeterminate animation and show final progress
          stopIndeterminateProgress();
          if (response.error) {
            displayError(response.error);
          } else {
            displayOrderDetails(response);
          }
          $('#renderResponse').show();
          $('#orderForm').hide();
          $("#submitButton").prop("disabled", false).text("Fetch details");
        },
        error: function (error) {
          stopIndeterminateProgress();
          console.error("Error fetching order details:", error);
          var errorMessage = error.responseJSON ? error.responseJSON.error : "Error fetching order details.";
          displayError(errorMessage);
          $('#renderResponse').show();
          $('#orderForm').hide(); 
          $("#submitButton").prop("disabled", false).text("Fetch details");
        }
      });
    });

  });
</script>

<div style="max-width: 400px; margin: 0 auto;">
    <!-- Order progress bar (hidden until results) -->
    <div id="orderProgressContainer" style="display:none; margin-bottom:12px;">
      <div id="orderProgress" class="order-progress" aria-hidden="false"></div>
    </div>
  <form id="orderForm" class="grid gap-12">
    <div   class="grid gap-5">
      <div class="field">
        <input id="orderNumber" type="text" class="input is-floating" name="orderNumber" placeholder="Order Number" aria-label="Order number" required="" autofocus="">
        <label class="label is-floating">Order number</label>
        <p class="column__text">Please provide the order number of the order to be tracked.</p>
      </div>
      <div class="field">
        <input id="email" type="text" class="input is-floating" name="email" placeholder="Email / Phone" aria-label="Email / Phone" required="">
        <label class="label is-floating">Email / Phone</label>
        <p class="column__text">Please provide your phone number or email id.</p>
      </div>
      <button type="submit" id="submitButton" class="button button--primary button--fixed" is="hover-button">
        <span class="btn-fill" data-fill="" style="transform: translateY(var(--motion-translateY)); --motion-translateY: -76%;"></span>
        <span class="btn-text"> Fetch details</span>
        <span class="btn-loader">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </div>
  </form>

  <div id="renderResponse" class="ProductItem__Wrapper w-100" style="display: none;">
    <div class="flex justify-between flex-col">
      <button id="closeCurrent" class="button button--secondary button--close items-center justify-center" type="button" is="hover-button" aria-label="Close">
        <span class="btn-fill" data-fill="" style="transform: translateY(var(--motion-translateY)); --motion-translateY: -76%;"></span>
        <span class="btn-text"><svg class="icon icon-close icon-sm" viewBox="0 0 20 20" stroke="currentColor" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 15L15 5M5 5L15 15"></path>
        </svg></span>
        <span class="btn-loader">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>

      <div id="orderDetails" style="display: none;">
        <header class="Form__Header">
          <h4 class="heading text-xl-3xl tracking-tighter leading-tight">Order details</h4>
        </header>
        <div id="orderNumberDisplay"></div>
        <div id="emailAddress"></div>
        <div id="customerPhone"></div>
        <div id="fulfillmentStatus"></div>
        <div id="financialStatus"></div>

        <div class="Segment">
          <h4 class="heading text-xl-3xl tracking-tighter leading-tight">Tracking details</h4>
          <div class="Segment__Content">
            <div id="fulfillments"></div>
          </div>
        </div>

        <div class="Segment">
          <h4 class="heading text-xl-3xl tracking-tighter leading-tight">Shipping address</h4>
          <div class="Segment__Content">
            <span id="shippingAddress" class="AccountAddress"></span>
          </div>
        </div>

        <div class="Segment">
          <h4 class="heading text-xl-3xl tracking-tighter leading-tight">Order items</h4>
          <div class="Segment__Content">
            <div id="lineItems"></div>
          </div>
        </div>
      </div>

      <div id="errorDiv" style="display: none;">
        <header class="Form__Header">
          <h4 class="heading text-xl-3xl tracking-tighter leading-tight">Error</h4>
        </header>
        <p class="ta-center" id="errorMessage"></p>
      </div>
    </div>
  </div>
</div>
