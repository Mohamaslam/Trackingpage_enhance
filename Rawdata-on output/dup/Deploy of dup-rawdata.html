<style>
  /* Page background and shell to match sample image */
  body { background: #e9f0f7; }
  .page-shell { max-width: 1100px; margin: 28px auto; padding: 28px; box-sizing: border-box }
  .content-card {
    background: #f8fafc; /* very light gray outer card */
    border-radius: 18px;
    padding: 26px;
    box-shadow: 0 18px 40px rgba(15,23,42,0.06);
  }
  .PageHeader {
    display: none;
  }

  .w-100 {
    width: 100% !important;
  }

  .cap {
    text-transform: capitalize;
    color: rgb(var(--color-foreground) / 1);
  }

  .nr {
    color: rgb(var(--color-foreground) / 1);
  }

  #renderResponse p {
    color: rgb(var(--color-foreground) / .6);
  }

  #renderResponse .Segment__Title {
    margin-bottom: 14px;
  }

  #renderResponse .Segment {
    margin-top: 25px;
    border-bottom: 1px solid rgb(var(--color-border));
    padding-bottom: 25px;
  }

  #renderResponse .Segment:last-child {
    border-bottom: none;
  }

  #renderResponse .Segment+.Segment {
    margin-top: 25px;
  }

  #renderResponse .mb-0 {
    margin-top: 0;
    margin-bottom: 0;
  }

  #renderResponse .mb-4 {
    margin-bottom: 20px;
  }

  .ta-center {
    text-align: center;
  }

  #renderResponse .mt-4 {
    margin-top: 20px;
  }

  #renderResponse .button--close {
    height: var(--sp-12);
    width: var(--sp-12);
    flex: 0 0 auto;
    margin-inline-start: auto;
  }

  p.orderConfirmation {
    color: var(--text-color) !important;
    line-height: 1.65;
    margin-bottom: 20px;
    border: 1px solid rgb(var(--color-foreground));
    padding: 6px;
  }

  /* Status badge styles */
  .status-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
    color: #fff;
    vertical-align: middle;
  }

  .status--processing { background: #f59e0b; } /* amber */
  .status--pending    { background: #6b7280; } /* gray */
  .status--shipped    { background: #3b82f6; } /* blue */
  .status--delivered  { background: #10b981; } /* green */
  .status--cancelled  { background: #ef4444; } /* red */
  .status--in_transit  { background: #6366f1; } /* indigo */
  .status--default    { background: #374151; }

  /* Progress stepper styles */
  .order-progress {
    /* replace per-step layout with a single horizontal track */
    display: block;
    position: relative;
    padding: 12px 6px; /* slightly reduced vertical padding for slim look */
    background: transparent;
    overflow: visible; /* ensure emoji isn't clipped */
  }

  .order-track {
    position: relative;
    height: 6px; /* slim track like sample */
    background: rgba(229,231,235,0.9);
    border-radius: 6px;
    overflow: visible;
    z-index: 0;
  }

  .order-track-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: linear-gradient(90deg,#10b981,#16a34a); /* soft green gradient */
    border-radius: 6px;
    transition: width 4500ms cubic-bezier(.2,.8,.2,1);
    z-index: 3; /* above markers so fill can visually cover markers when active */
  }
  .order-track-fill .flow{position:absolute;left:-40%;top:0;bottom:0;width:60%;background:linear-gradient(90deg,rgba(255,255,255,0.18),rgba(255,255,255,0.02),rgba(255,255,255,0.18));opacity:0.55;animation:flow 1.2s linear infinite}
  @keyframes flow{from{transform:translateX(0)}to{transform:translateX(160%)}}

  .order-markers {
    display: flex;
    justify-content: space-between;
    /* pull markers down so they overlap the track and appear merged */
    margin-top: -8px; /* slightly lifted, leaving more room for labels */
  }

  .order-marker {
    font-size: 12px;
    color: #374151;
    text-align: center;
    flex: 1 1 0;
    padding: 0 6px;
    white-space: nowrap;
  }

  /* visible dot above the track for each marker */
  .order-marker {
    position: relative;
    padding-top: 12px; /* keep dot centered on the track */
  }

  .order-marker::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e6e9ee;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    transition: background 450ms ease, transform 450ms ease, box-shadow 450ms ease, opacity 200ms ease;
    z-index: 4; /* above the fill so marker visually sits on top */
    display:flex;align-items:center;justify-content:center;
  }

  /* checkmark (hidden until active) */
  .order-marker::after {
    content: '\2713';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    font-size: 14px;
    color: white;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    transition: opacity 300ms ease, transform 300ms ease;
  }

  .order-marker.active::before {
    background: #10b981; /* green */
    transform: translate(-50%, -50%) scale(1.05);
    box-shadow: 0 6px 18px rgba(16,185,129,0.14);
  }

  .order-marker.active::after { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .order-marker .marker-label{
    display:block;
    margin-top:40px; /* push text further down below the pill */
    font-size:16px; /* larger for clarity */
    color:#111827; /* darker for better contrast */
    font-weight:700; /* bolder for visibility */
    line-height:1.2;
    white-space:normal; /* allow wrapping for long labels */
    overflow:visible; /* show full text */
    max-width:120px; /* give labels more room */
    display:inline-block;
    text-align:center;
    position:relative;
    z-index:6; /* above fill so label stays readable */
  }

  /* active label emphasised */
  .order-marker.active .marker-label {
    color: #0b63e6; /* blue tint to indicate active */
    font-weight:700;
  }

  /* current step label above track */
  .current-step-label{
    text-align:center;
    font-size:15px;
    color:#0f172a;
    font-weight:700;
    margin: 0 0 6px 0;
  }

  /* moving emoji that shows progress */
  .track-emoji {
    position: absolute;
    top: -10px; /* sit slightly above the track */
    left: 0%;
    transform: translateX(-50%) scale(1);
    /* use same duration for left and transform to keep movements in sync */
    transition: left 2200ms cubic-bezier(.2,.8,.2,1), transform 2200ms cubic-bezier(.2,.8,.2,1);
    font-size: 22px;
    pointer-events: none;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.12));
    z-index: 9999;
  }

  /* truck always faces right */
  .track-emoji.truck { 
    transform-origin: center center;
    /* always face right: align the truck's right edge to the track position
       and force a neutral rotation so platform emoji variants appear consistent */
    transform: translateX(-100%) scale(1) scaleX(1) rotate(0deg);
    transition: left 2200ms cubic-bezier(.2,.8,.2,1), transform 2200ms cubic-bezier(.2,.8,.2,1);
  }
  /* when at delivered state, just scale up slightly */
  .track-emoji.truck.rotate { 
    transform: translateX(-100%) scale(1.15) scaleX(1) rotate(0deg); 
  }

  .step-label {
    font-size: 12px;
    color: #374151;
  }

  .step-completed .step-indicator {
    background: #10b981; /* green */
  }

  .step-current .step-indicator {
    background: #3b82f6; /* blue */
  }

  .step-completed .step-line,
  .step-current .step-line {
    background: transparent;
  }

  /* indicator animation */
  .step-indicator {
    transition: transform 900ms ease, background 900ms ease, box-shadow 900ms ease;
  }

  .step-completed .step-indicator {
    transform: scale(1.05);
  }

  .step-current .step-indicator {
    transform: scale(1.25);
    box-shadow: 0 0 0 6px rgba(59,130,246,0.08);
  }

  /* Form card and controls styling */

  .tracking-form-card {
    background: #ffffff;
    border: 1px solid #e6e9ee;
    padding: 14px; /* tightened padding */
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(15,23,42,0.04);
    margin-bottom: 8px;
  }

  .tracking-form-card h3 { margin: 0 0 6px 0; font-size: 18px; color: #0f172a }
  .tracking-form-card p.lead { margin: 0 0 8px 0; color: #475569; font-size: 14px }

  /* nicer primary button */
  .btn-primary-custom {
    background: linear-gradient(180deg,#0b63e6,#0657c8);
    color: #fff;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(11,99,230,0.12);
  }
  .btn-primary-custom:disabled { opacity: 0.6; cursor: not-allowed }

   /* secondary button */
   .btn-secondary-custom {
     background: #ffffff;
     color: #0f172a;
     border: 1px solid #e6e9ee;
     padding: 9px 12px;
     border-radius: 8px;
     font-weight: 700;
     cursor: pointer;
   }

  /* form fields spacing inside card */
  .tracking-form-card .field { margin-bottom: 8px }
  .tracking-form-card label.label { display:block; margin-bottom:6px; font-size:14px; color:#334155 }
  .tracking-form-card input.input { width:100%; padding:8px 10px; border:1px solid #e6e9ee; border-radius:6px }

  /* Compact layout for narrow containers */
  @media (max-width: 420px) {
    .step-label { display: none; }
  }

  /* Result card layout */
  .result-card {
    background: #fff;
    border: 1px solid #e6e9ee;
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 8px 30px rgba(15,23,42,0.04);
    display: grid;
    grid-template-columns: 1fr; /* stack vertically so we can center the summary */
    gap: 12px;
    align-items: center;
    width: 100%;
    box-sizing: border-box;
  }

  /* data table styles to match mock */
  .table-card { background:#fff; border:1px solid #e6e9ee; border-radius:10px; box-shadow:0 8px 30px rgba(15,23,42,0.04); padding:14px }
  .table-card h4 { margin:0 0 10px 0; font-size:16px; color:#0f172a }
  .table-toolbar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px }
  .table-toolbar .left { display:flex; align-items:center; gap:8px; font-size:14px; color:#475569 }
  .table-toolbar select, .table-toolbar input { border:1px solid #e6e9ee; border-radius:6px; padding:6px 8px; font-size:13px; background:#fff; color:#0f172a }
  .orders-table { width:100%; border-collapse:separate; border-spacing:0; font-size:14px }
  .orders-table thead th { text-align:left; color:#475569; background:#f9fafb; border-bottom:1px solid #e6e9ee; padding:10px 10px; font-weight:600 }
  .orders-table tbody td { padding:12px 10px; border-bottom:1px solid #eef2f7; color:#0f172a }
  .orders-table tfoot td { padding:10px; color:#6b7280; font-size:12px }
  .badge-pill { display:inline-block; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:700; color:#fff }
  .badge-gray { background:#9ca3af }
  .badge-indigo { background:#818cf8 }
  .badge-green { background:#34d399 }
  .table-footer { display:flex; justify-content:space-between; align-items:center; margin-top:10px }
  .pager { display:flex; gap:8px; align-items:center }
  .pager button { border:1px solid #e6e9ee; background:#fff; border-radius:6px; padding:6px 10px; font-size:12px; color:#0f172a; cursor:pointer }
  .pager .current { background:#eef2ff; color:#4338ca; border-color:#c7d2fe }

  /* subtle warning banner */
  .alert { padding:10px 12px; border-radius:8px; font-size:13px; margin-top:8px }
  .alert-warning { background:#fff7ed; color:#9a3412; border:1px solid #fed7aa }

  /* small details chips under status */
  .details-row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px }
  .detail-chip { background:#f1f5f9; border:1px solid #e2e8f0; color:#0f172a; border-radius:999px; padding:8px 12px; font-size:14px; font-weight:700 }
  .detail-chip .key { color:#475569; margin-right:6px }

  /* prominent carrier tracking link */
  .carrier-link { display:inline-flex; align-items:center; gap:8px; background:#0b63e6; color:#fff !important; text-decoration:none; padding:10px 14px; border-radius:10px; font-size:16px; font-weight:900; box-shadow:0 6px 18px rgba(11,99,230,0.18) }
  .carrier-link:hover { background:#0657c8 }
  .carrier-link .emoji { font-size:16px; line-height:1 }
  /* larger order id text */
  .track-header .order-code { font-size:18px !important; font-weight:800; color:#111827 !important }
  .track-header .order-code #trackOrderCode { font-weight:900 }

  .result-summary { padding: 8px 12px; width: 100%; max-width: 720px; margin: 0 auto; text-align: left; }
  .result-summary .summary-row { display:flex; padding:8px 0; border-bottom:1px dashed rgba(15,23,42,0.03); align-items:center }
  .result-summary .summary-row:last-child { border-bottom: none; }
  .result-summary .summary-key { color:#6b7280; font-size:13px; flex: 0 0 55%; }
  .result-summary .summary-val { color:#0f172a; font-weight:700; text-align:right; flex: 0 0 45%; }

  /* Center labels and increase font sizes for readability */
  .result-card h3 { font-size: 22px; text-align: center; margin-bottom: 10px }
  .result-summary { text-align: center; background:#f9fafb; border:1px solid #eef2f7; border-radius:10px; padding:16px 18px; }
  .result-summary .summary-row { justify-content: center; }
  .result-summary .summary-key { font-size: 16px; color: #334155; font-weight:700; flex: 0 0 50%; text-align: center }
  .result-summary .summary-val { font-size: 19px; color: #0f172a; font-weight: 900; flex: 0 0 50%; text-align: center }
  .result-summary h4 { font-size: 19px; font-weight:800; text-align: center; margin-bottom:8px }

  .tracking-timeline { list-style:none; margin:0; padding:0; }
  .tracking-timeline li { padding:8px 6px; border-left:3px solid transparent; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center }
  .tracking-timeline li.completed { border-left-color: #10b981; color:#0f172a }
  .tracking-timeline li.current { border-left-color: #3b82f6; font-weight:700 }
  .timeline-label { font-size:13px; flex: 0 0 65%; }
  .timeline-time { font-size:12px; color:#6b7280; flex: 0 0 35%; text-align:right }

  /* Make the result card stack on small screens */
  @media (max-width: 780px) {
    .result-card { grid-template-columns: 1fr; }
    .result-summary { order: 2 }
  }

  /* Responsive tweaks for tablets and phones */
  @media (max-width: 680px) {
    .page-shell { padding: 14px; }
    .content-card { padding: 16px; border-radius: 12px; }
    .current-step-label { font-size: 12px; }
    .order-marker .marker-label { font-size: 12px; margin-top: 32px; max-width: 88px; line-height: 1.25; }
    .result-card h3 { font-size: 16px; }
    .result-summary { padding: 10px 12px; }
    .result-summary .summary-key { font-size: 13px; }
    .result-summary .summary-val { font-size: 15px; }
    .table-toolbar { flex-direction: column; align-items: stretch; gap: 6px; }
    .table-toolbar .left { justify-content: flex-start; }
    .orders-table thead th, .orders-table tbody td { padding: 8px 8px; }
    /* Hide low-priority payout column on small screens */
    .orders-table thead th:nth-child(8),
    .orders-table tbody td:nth-child(8) { display: none; }
    /* Make cancel button easier to tap */
    #cancelTracking { width: 100%; }
    .tracking-form-card input.input { padding: 12px 12px; font-size: 16px; }
  }
  @media (max-width: 420px) {
    .page-shell { padding: 10px; }
    .order-marker .marker-label { font-size: 11px; max-width: 76px; margin-top: 30px; }
    .result-summary .summary-key { font-size: 12px; }
    .result-summary .summary-val { font-size: 14px; }
    /* On very small screens also hide Order Status column */
    .orders-table thead th:nth-child(7),
    .orders-table tbody td:nth-child(7) { display: none; }
  }
</style>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<script>
  $(document).ready(function () {

    // ---------- Functions ----------
    function statusBadge(status) {
      if (!status) return '<span class="status-badge status--default" aria-label="status unknown">Unknown</span>';
      var key = String(status).toLowerCase().replace(/\s+/g, '_');
      var map = {
        'processing': { cls: 'status--processing', label: 'Processing' },
        'pending': { cls: 'status--pending', label: 'Pending' },
        'shipped': { cls: 'status--shipped', label: 'Shipped' },
        'delivered': { cls: 'status--delivered', label: 'Delivered' },
        'cancelled': { cls: 'status--cancelled', label: 'Cancelled' },
        'in_transit': { cls: 'status--in_transit', label: 'In transit' }
      };
      var entry = map[key] || { cls: 'status--default', label: status };
      return '<span class="status-badge ' + entry.cls + '" role="status" aria-live="polite">' + entry.label + '</span>';
    }

    // Progress stepper renderer
    // Use a 5-step sequence:
    // 0: Ordered, 1: Pickup scheduled, 2: In transit, 3: Out for delivery, 4: Delivered
    var defaultSteps = ['Ordered', 'Pickup scheduled', 'In transit', 'Out for delivery', 'Delivered'];

    // Map known tokens to the 4-step index. We use ordered checks so more specific tokens
    // are matched first. 'Out for delivery' will be treated as 'In transit' (index 2)
    // because the server uses only four statuses.
    function mapShipmentStatusToStep(status) {
      if (!status) return 0; // Ordered
      var s = String(status).toLowerCase();
      // exact/common tokens -> index
      var mappings = [
        { tokens: ['ordered','placed','processing','pending'], idx: 0 },
        { tokens: ['pickup scheduled','pickup','pickup_scheduled','pickupscheduled'], idx: 1 },
        { tokens: ['in transit','in_transit','transit','on the way','on its way'], idx: 2 },
        { tokens: ['out for delivery','out_for_delivery'], idx: 3 },
        { tokens: ['delivered','complete','fulfilled','completed','delivered_successfully'], idx: 4 }
      ];
      for (var i = 0; i < mappings.length; i++) {
        var entry = mappings[i];
        for (var j = 0; j < entry.tokens.length; j++) {
          if (s.indexOf(entry.tokens[j]) !== -1) return entry.idx;
        }
      }
      // fallback: if contains 'transit' map to in transit
      if (s.indexOf('transit') !== -1) return 2;
      return 0;
    }

    // Helper: recursively scan object/string fields for known tokens and return the first matching value
    function scanForKnownTokensInObject(obj, tokens) {
      if (!obj || !tokens) return null;
      if (typeof obj === 'string') {
        var lower = obj.toLowerCase();
        for (var t = 0; t < tokens.length; t++) if (lower.indexOf(tokens[t]) !== -1) return obj;
        return null;
      }
      if (Array.isArray(obj)) {
        for (var a = 0; a < obj.length; a++) {
          var res = scanForKnownTokensInObject(obj[a], tokens);
          if (res) return res;
        }
        return null;
      }
      if (typeof obj === 'object') {
        for (var k in obj) {
          if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
          var v = obj[k];
          if (typeof v === 'string') {
            var lower = v.toLowerCase();
            for (var ti = 0; ti < tokens.length; ti++) if (lower.indexOf(tokens[ti]) !== -1) return v;
          } else if (typeof v === 'object') {
            var nested = scanForKnownTokensInObject(v, tokens);
            if (nested) return nested;
          }
        }
      }
      return null;
    }

    // Collect all possible status candidates from the response and choose the most advanced step.
    function deriveProgressStatus(orderData) {
      if (!orderData) return null;
      var candidates = [];
      var pushIf = function(v){ if (v && String(v).trim()) candidates.push(String(v)); };
      // fulfillment-level fields
      if (orderData.fulfillments && orderData.fulfillments.length > 0) {
        var f = orderData.fulfillments[0] || {};
        pushIf(f.shipment_status);
        pushIf(f.status);
        pushIf(f.tracking_status);
        pushIf(f.fulfillment_status);
        // events/history often contains the ground truth from carrier
        var events = f.events || f.history || f.tracking_events || null;
        if (Array.isArray(events)) {
          for (var ei=0; ei<events.length; ei++) {
            var ev = events[ei] || {};
            pushIf(ev.status || ev.name || ev.event || ev.description);
          }
        }
        // only as absolute last resort, infer transit from tracking numbers when NO other signals present
        if (candidates.length === 0) {
          if (f.tracking_numbers && f.tracking_numbers.length > 0) pushIf('in transit');
          if (f.tracking_urls && f.tracking_urls.length > 0) pushIf('in transit');
        }
      }
      // order-level fields
      if (orderData.orders) {
        pushIf(orderData.orders.fulfillment_status);
        pushIf(orderData.orders.financial_status);
      }
      // scan objects for any token if still empty
      if (candidates.length === 0) {
        var token = scanForKnownTokensInObject(orderData, ['pending','processing','ordered','pickup scheduled','pickup','pickupscheduled','shipped','dispatched','in transit','in_transit','transit','out for delivery','out_for_delivery','on the way','delivered','complete','fulfilled','completed']);
        pushIf(token);
      }
      if (candidates.length === 0) return null;
      // choose the most advanced mapped step among candidates
      var bestIdx = 0; var bestRaw = candidates[0];
      for (var ci=0; ci<candidates.length; ci++) {
        var idx = mapShipmentStatusToStep(candidates[ci]);
        if (idx > bestIdx) { bestIdx = idx; bestRaw = candidates[ci]; }
        // if any candidate clearly indicates delivered, short-circuit
        var low = String(candidates[ci]).toLowerCase();
        if (low.indexOf('delivered') !== -1 || low.indexOf('fulfilled') !== -1 || low.indexOf('complete') !== -1 || low.indexOf('completed') !== -1) {
          bestIdx = 4; bestRaw = candidates[ci]; break;
        }
      }
      // return the raw best candidate string; rendering will map to step
      return String(bestRaw);
    }

    // Detect if we inferred the status from tracking numbers/urls so diagnostics can show the source
    function inferenceSource(orderData) {
      if (!orderData) return null;
      if (orderData.fulfillments && orderData.fulfillments.length > 0) {
        var f = orderData.fulfillments[0];
        if (f) {
          if (!f.shipment_status) {
            if (f.tracking_numbers && f.tracking_numbers.length > 0) return 'tracking_numbers';
            if (f.tracking_urls && f.tracking_urls.length > 0) return 'tracking_urls';
          }
        }
      }
      return null;
    }

    function renderOrderProgress(steps, activeIndex) {
      steps = steps || defaultSteps;
      activeIndex = Math.max(0, Math.min(steps.length - 1, activeIndex || 0));

      var container = $('#orderProgress');
      container.empty();
      // update current step label
      try { $('#currentStepLabel').text(stepLabelForIndex(activeIndex)); } catch(e) {}
      // single continuous track
      var track = $('<div class="order-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>');

        error: function (error) {
          stopIndeterminateProgress();
          console.error("Error fetching order details:", error);
          var errorMessage = error.responseJSON ? error.responseJSON.error : "Error fetching order details.";
          displayError(errorMessage);
          $('#renderResponse').show();
          $('#orderForm').hide(); 
          $("#submitButton").prop("disabled", false).text("Fetch details");
        }
      });
    });

    // Simulation removed: production form will call the real API via submit

  });
</script>
