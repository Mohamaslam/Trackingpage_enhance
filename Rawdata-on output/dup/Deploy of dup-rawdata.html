      // Detect abnormal/unmapped shipment statuses and surface a warning
      try {
        var explicitStatus = null;
        if (orderData.fulfillments && orderData.fulfillments.length > 0 && orderData.fulfillments[0]) {
          var ff = orderData.fulfillments[0];
          explicitStatus = ff.shipment_status || ff.status || ff.tracking_status || ff.fulfillment_status || null;
        }
        var rawShown = explicitStatus || progressStatus || null;
        var normalized = rawShown ? String(rawShown).toLowerCase() : '';
        var known = ['ordered','placed','processing','pending','pickup scheduled','pickup','pickupscheduled','shipped','dispatched','in transit','in_transit','transit','out for delivery','delivered','complete','fulfilled','completed'];
        var isKnown = known.some(function(k){ return normalized.indexOf(k) !== -1; });
        var warn = false;
        // warn if we had some status string but it didn't map to a known token set
        if (rawShown && !isKnown) warn = true;
        // also warn if explicit status exists but maps to the first step while not a first-step token
        if (explicitStatus && activeStep === 0) {
          var firstStepTokens = ['ordered','placed','processing','pending'];
          var isFirst = firstStepTokens.some(function(k){ return normalized.indexOf(k) !== -1; });
          if (!isFirst) warn = true;
        }
        if (warn) {
          $('#statusWarning').html('Unexpected shipment status from API: "' + String(rawShown) + '". Showing best-effort mapping.').show();
          console.warn('Unexpected shipment status from API:', rawShown, { explicitStatus: explicitStatus, derived: progressStatus, mappedStep: activeStep });
        } else {
          $('#statusWarning').hide().empty();
        }
      } catch (diagErr) {
        console.warn('Status diagnostics failed', diagErr);
      }

      // Build the table rows for All Orders section (single order view)
      var $tbody = $('#ordersTableBody');
      $tbody.empty();
      var lineItems = Array.isArray(order.line_items) ? order.line_items : [];
      var total = 0;
      // Reflect item count in the "Show entries" select
      try {
        var itemCount = lineItems.length;
        var $sel = $('#showEntries');
        if ($sel.length) {
          if ($sel.find('option[value="' + itemCount + '"]').length === 0) {
            // add an option matching the exact item count and mark it as selected
            var $opt = $('<option></option>').attr('value', String(itemCount)).text(String(itemCount));
            $sel.append($opt);
          }
          $sel.val(String(itemCount));
        }
      } catch(e) { /* noop */ }
      for (var i = 0; i < lineItems.length; i++) {
        var li = lineItems[i];
        var qty = Number(li.quantity || 1);
        var price = Number(li.price || li.line_price || 0);
        var rowTotal = isNaN(qty * price) ? 0 : qty * price;
        total += rowTotal;
  var $tr = $('<tr></tr>');
  $tr.append('<td>' + String(i+1).padStart(2,'0') + '</td>');
  $tr.append('<td>' + (li.name || 'Item') + '</td>');
  $tr.append('<td>' + qty + '</td>');
  $tr.append('<td>' + rowTotal + '</td>');
        // Order status badge
        var ordStatus = (order.financial_status || order.fulfillment_status) || 'Done';
        var ordBadge = '<span class="badge-pill badge-indigo">' + (ordStatus ? String(ordStatus).charAt(0).toUpperCase() + String(ordStatus).slice(1) : 'Done') + '</span>';
        $tr.append('<td>' + ordBadge + '</td>');
        $tbody.append($tr);
      }
      if (lineItems.length === 0) {
        var $trEmpty = $('<tr><td colspan="5" style="color:#6b7280">No items</td></tr>');
        $tbody.append($trEmpty);
      }

      // product search removed per request

      // Populate contact details in the right panel
      try {
        var emailVal = (order.email || order.customer_email) || '—';
        var phoneVal = (order.phone || (order.shipping_address && order.shipping_address.phone) || (order.billing_address && order.billing_address.phone)) || '—';
        $('#contactEmail').text(emailVal || '—');
        $('#contactPhone').text(phoneVal || '—');
      } catch(e) {
        $('#contactEmail').text('—');
        $('#contactPhone').text('—');
      }

      // Populate shipping address inline next to the carrier link
      try {
        var a = order.shipping_address;
        var lines = [];
        if (a && typeof a === 'object') {
          var name = a.name || ((a.first_name && a.last_name) ? (a.first_name + ' ' + a.last_name) : '');
          if (name) lines.push(name);
          if (a.address1) lines.push(a.address1);
          if (a.address2) lines.push(a.address2);
          var cityLine = [a.city, a.province, a.zip].filter(Boolean).join(', ');
          if (cityLine) lines.push(cityLine);
          if (a.country) lines.push(a.country);
        } else if (a && typeof a === 'string') {
          // if address is a string, split by newlines and filter out phone-related lines
          var addrStr = String(a);
          var addrLines = addrStr.split(/\n|<br\s*\/?>/i).map(function(l){ return l.trim(); }).filter(Boolean);
          addrLines.forEach(function(l){
            // filter out lines that look like phone numbers
            var lower = l.toLowerCase();
            if (lower.indexOf('phone') === -1 && lower.indexOf('tel') === -1 && !/^[\d\s\-\+\(\)]+$/.test(l)) {
              lines.push(l);
            }
          });
        }
        var $addr = $('#shipAddressInline');
        $addr.empty();
        if (lines.length === 0) { $addr.append('<div class="address-line">—</div>'); }
        else { lines.forEach(function(l){ $addr.append('<div class="address-line">' + l + '</div>'); }); }
      } catch(e) {
        $('#shipAddressInline').html('<div class="address-line">—</div>');
      }

      // Removed auto-scroll to avoid unexpected page jumps after rendering
    }

    function displayError(errorMessage) {
      $("#orderDetails").hide();
      $("#errorDiv").show();
      $("#errorMessage").text(errorMessage);
    }

    /* product search removed */

    // ---------- Event Handlers ----------
    // Cancel button performs the same reset as close
    $("#cancelTracking").click(function (e) {
      stopIndeterminateProgress();
      clearProgressAnimation();
      $('#orderProgressContainer').hide();
      try { $('#currentStepLabel').text(''); } catch(err) {}
      $("#renderResponse").hide();
      $("#orderForm").show();
      $("#orderNumber, #email").val('');
      e.preventDefault();
    });

    $("#orderForm").submit(function (event) {
      event.preventDefault();

      $("#submitButton").prop("disabled", true).text("Fetching...");

      var orderNumber = $("#orderNumber").val();
      var email = $("#email").val();

      // show indeterminate progress immediately
      startIndeterminateProgress();

      $.ajax({
        url: "https://ebrandzify.com/tracking",
        method: "GET",
        data: {
          order_id: orderNumber,
          email: email
        },
        dataType: "json",
        success: function (response) {
          // stop indeterminate animation and show final progress
          stopIndeterminateProgress();
          if (response.error) {
            displayError(response.error);
          } else {
            displayOrderDetails(response);
          }
          $('#renderResponse').show();
          $('#orderForm').hide();
          $("#submitButton").prop("disabled", false).text("Fetch details");
        },
        error: function (error) {
          stopIndeterminateProgress();
          console.error("Error fetching order details:", error);
          var errorMessage = error.responseJSON ? error.responseJSON.error : "Error fetching order details.";
          displayError(errorMessage);
          $('#renderResponse').show();
          $('#orderForm').hide(); 
          $("#submitButton").prop("disabled", false).text("Fetch details");
        }
      });
    });

    // Simulation removed: production form will call the real API via submit

  });
</script>

<div class="page-shell">
  <div class="content-card">
    <!-- Order progress bar (hidden until results) -->
    <div id="orderProgressContainer" style="display:none; margin-bottom:12px;">
      <div id="currentStepLabel" class="current-step-label" aria-live="polite"></div>
      <div id="orderProgress" class="order-progress" aria-hidden="false"></div>
    </div>
  <form id="orderForm" class="grid gap-12">
    <div class="tracking-form-card">
      <h3>Track your order</h3>
      <p class="lead">Enter the order number and your email or phone to see the latest tracking status.</p>
      <div class="grid gap-5">
        <div class="field">
          <label class="label">Order number</label>
          <input id="orderNumber" type="text" class="input is-floating" name="orderNumber" placeholder="e.g. TRIP-12345" aria-label="Order number" required autofocus>
        </div>
        <div class="field">
          <label class="label">Email or phone</label>
          <input id="email" type="text" class="input is-floating" name="email" placeholder="you@example.com or 9876543210" aria-label="Email / Phone" required>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button type="submit" id="submitButton" class="btn-primary-custom">Fetch details</button>
        </div>
      </div>
    </div>
  </form>

  <div id="renderResponse" class="ProductItem__Wrapper w-100" style="display: none;">
    <div style="display:flex;justify-content:flex-start;align-items:center;margin-bottom:8px">
      <button id="cancelTracking" class="btn-secondary-custom" type="button" aria-label="Cancel and track another">Cancel and track another</button>
    </div>

    <div id="orderDetails" style="display: none;">
      <!-- Top card: order id + contact/address + carrier block -->
      <div class="result-card" style="padding:12px; margin-bottom:8px;">
        <div style="text-align:center;width:100%; margin-top:8px">
          <!-- Progress bar is rendered above page-wide and reused here -->
        </div>
        <div style="width:100%; margin-top:6px; color:#0f172a; font-size:13px">
          <div class="id-and-carrier">
            <div class="order-id-line">Order ID: <span id="trackOrderCode">—</span></div>
            <div class="carrier-header">
              <div id="statusLine" style="margin-bottom:6px">&nbsp;</div>
              <div id="carrierLine" style="color:#6b7280">&nbsp;</div>
            </div>
          </div>
          <div class="info-card">
            <h4 class="card-title">Shipping details</h4>
            <div class="info-grid">
              <div class="info-field">
                <div id="shipAddressInline">
                  <div class="address-line">—</div>
                </div>
              </div>
              <div class="info-field">
                <h5>Contact details</h5>
                <div class="address-line"><strong>Email:</strong> <span id="contactEmail">—</span></div>
                <div class="address-line"><strong>Phone:</strong> <span id="contactPhone">—</span></div>
              </div>
            </div>
          </div>
        </div>
        <div id="statusWarning" class="alert alert-warning" style="display:none"></div>
      </div>

      <!-- Second card: Products searchbox and list -->
      <div class="table-card">
        <h4>Order Items</h4>
          <div class="products-table-wrapper">
          <table class="orders-table" id="ordersTable">
            <thead>
              <tr>
                <th style="width:60px">#</th>
                <th>Product Name</th>
                <th style="width:80px">Qty</th>
                <th style="width:120px">Price</th>
                <th style="width:140px">Status</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="errorDiv" style="display: none;margin-top:8px">
      <h4 style="margin:0 0 8px 0">Error</h4>
      <p class="ta-center" id="errorMessage"></p>
    </div>
  </div>
  </div>
</div>
